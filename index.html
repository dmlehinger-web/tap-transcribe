<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tap Transcribe</title>
  <meta name="description" content="Tap once to transcribe on your iPhone. Notes stay on this phone, locked with a PIN.">
  <meta name="application-name" content="Tap Transcribe">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Transcribe">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-phase="idle" data-hear="idle">
  <main id="lock" class="lock">
    <p class="brand">Tap Transcribe</p>
    <h1 id="lock-title">Locked</h1>
    <p id="lock-help" class="help">Enter your PIN.</p>
    <p id="lock-error" class="error" role="alert" hidden></p>
    <div id="dots" class="dots" role="status" aria-label="0 of 6 digits"></div>
    <div id="pad" class="pad"></div>
    <button id="face" class="wide" type="button" hidden>Use Face ID</button>
    <button id="skip-face" class="wide quiet" type="button" hidden>Not now</button>
  </main>

  <div id="app" class="app" hidden inert>
    <div class="scroll">
    <header class="top">
      <div class="titles">
        <p class="brand">Tap Transcribe</p>
        <p class="lede">Tap once. Talk. Tap again.</p>
      </div>
      <div class="top-actions">
        <button id="audio-toggle" type="button" aria-pressed="false">Audio off</button>
        <button id="lock-now" type="button">Lock</button>
      </div>
    </header>

    <aside id="hint" class="hint" hidden>
      <p>Install from Safari: Share, then Add to Home Screen.</p>
      <button type="button" id="hint-dismiss">Dismiss</button>
    </aside>

    <div id="banner" class="banner" role="status" hidden></div>

    <section class="stage" aria-label="Transcript">
      <p id="hear" class="hear">
        <span class="dot" aria-hidden="true"></span>
        <span id="status-text">Ready</span>
        <span id="timer" class="timer" role="timer">00:00</span>
      </p>
      <div class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="live">
        <p id="live-placeholder" class="placeholder">Your words show up here.</p>
        <p id="live-text" class="live-text" hidden><span id="live-final"></span><span id="live-interim"></span></p>
      </div>
      <p id="save-state" class="save-state" aria-live="polite"></p>
      <p id="live-announce" class="sr-only" aria-live="polite"></p>
    </section>

    <section class="sessions" aria-labelledby="sessions-heading">
      <div class="sessions-head">
        <h2 id="sessions-heading">Sessions</h2>
        <span id="session-count" class="count" hidden></span>
        <button id="change-pin" class="text-btn" type="button">Change PIN</button>
      </div>
      <div id="session-list"></div>
    </section>
    </div>

    <div class="dock">
      <button id="tap" class="tap" type="button" aria-pressed="false" aria-label="Start transcription">
        <span class="rings" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="disc" aria-hidden="true">
          <svg class="mic" viewBox="0 0 64 64">
            <rect x="24" y="8" width="16" height="28" rx="8" fill="currentColor"></rect>
            <path d="M16 30a16 16 0 0 0 32 0" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path>
            <path d="M32 46v8M24 54h16" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path>
          </svg>
          <svg class="stop" viewBox="0 0 64 64">
            <rect x="20" y="20" width="24" height="24" rx="4" fill="currentColor"></rect>
          </svg>
        </span>
      </button>
      <p id="tap-label" class="tap-label">Tap</p>
    </div>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
