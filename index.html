<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tap Transcribe</title>
  <meta name="description" content="Tap once to record and transcribe on your iPhone. Tap again to stop.">
  <meta name="application-name" content="Tap Transcribe">
  <meta name="theme-color" content="#110e0b">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Transcribe">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-phase="idle">
  <div class="glow" aria-hidden="true"></div>
  <div class="app">
    <header class="top">
      <h1>Tap Transcribe</h1>
      <p class="lede">Tap once. Talk. Tap again to stop.</p>
    </header>

    <aside id="hint" class="hint" hidden>
      <p>Install from Safari: Share, then Add to Home Screen.</p>
      <button type="button" id="hint-dismiss">Dismiss</button>
    </aside>

    <div id="banner" class="banner" role="status" hidden></div>

    <section class="stage" aria-label="Recorder">
      <div class="readout">
        <p id="timer" class="timer" role="timer">00:00</p>
        <p class="status">
          <span class="dot" aria-hidden="true"></span>
          <span id="status-text">Ready</span>
          <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
        </p>
      </div>
      <div class="live">
        <p id="live-placeholder" class="placeholder">Words show up here while you talk.</p>
        <p id="live-text" class="live-text" hidden><span id="live-final"></span><span id="live-interim"></span></p>
        <p id="live-announce" class="sr-only" aria-live="polite"></p>
      </div>
    </section>

    <div class="tap-wrap">
      <button id="tap" class="tap" type="button" aria-pressed="false" aria-label="Start recording and transcription">
        <span class="ring" aria-hidden="true"></span>
        <span class="tap-icon" aria-hidden="true">
          <svg class="icon-mic" viewBox="0 0 64 64">
            <rect x="24" y="6" width="16" height="30" rx="8" fill="currentColor"></rect>
            <path d="M16 28a16 16 0 0 0 32 0" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path>
            <path d="M32 44v10M23 54h18" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path>
          </svg>
          <svg class="icon-stop" viewBox="0 0 64 64">
            <rect x="18" y="18" width="28" height="28" rx="6" fill="currentColor"></rect>
          </svg>
        </span>
        <span id="tap-label" class="tap-label">Tap</span>
      </button>
    </div>

    <section class="sessions" aria-labelledby="sessions-heading">
      <div class="sessions-head">
        <h2 id="sessions-heading">Sessions</h2>
        <span id="session-count" class="count" hidden></span>
      </div>
      <div id="session-list"></div>
    </section>
  </div>
  <script src="./app.js"></script>
</body>
</html>
